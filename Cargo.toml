[workspace]
members = [".", "metta-trie"]
resolver = "2"

[package]
name = "mettatron"
version = "0.2.0"
edition = "2021"
authors = ["F1R3FLY.io"]
description = "MeTTaTron - MeTTa language evaluator with lazy evaluation and pattern matching"
license = "Apache-2.0"
repository = "https://github.com/F1R3FLY-io/MeTTa-Compiler"
keywords = ["metta", "evaluator", "lisp", "pattern-matching"]
categories = ["compilers", "parser-implementations"]

[lib]
name = "mettatron"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mettatron"
path = "src/main.rs"

[[bench]]
name = "rule_matching"
harness = false

[[bench]]
name = "pattern_match"
harness = false

[[bench]]
name = "type_lookup"
harness = false

[[bench]]
name = "prefix_navigation_benchmarks"
harness = false

[[bench]]
name = "bulk_operations"
harness = false

[[bench]]
name = "cow_environment"
harness = false

[[bench]]
name = "algebraic_status_duplicate_detection"
harness = false

[[bench]]
name = "expression_parallelism"
harness = false

[[bench]]
name = "branch_comparison"
harness = false

[[bench]]
name = "mork_evaluation"
harness = false

[[bench]]
name = "simd_micro"
harness = false

[[bench]]
name = "mmverify_benchmark"
harness = false

[[bench]]
name = "memoization_benchmark"
harness = false

[[bench]]
name = "bytecode_comparison"
harness = false

[[bench]]
name = "jit_comparison"
harness = false

[[bench]]
name = "jit_tier1_benchmarks"
harness = false

[[bench]]
name = "jit_optimization_benchmarks"
harness = false

[[bench]]
name = "iter_rules_bench"
harness = false

[[bench]]
name = "match_space_multiplicity"
harness = false

[[bench]]
name = "type_system"
harness = false

[dependencies]
# MettaTrie - Native trie-map for MeTTa expression storage (replaces MORK+PathMap)
metta-trie = { path = "metta-trie" }
# Models - Rholang protobuf models for Par integration
models = { path = "../f1r3node/models" }
# Tokio - Async runtime for parallel evaluation (optional)
tokio = { version = "1", features = ["rt", "sync"], optional = true }

# Tree-sitter - Parser for LSP support
tree-sitter = "0.25"
tree-sitter-metta = { path = "tree-sitter-metta" }

# REPL dependencies
rustyline = "14.0"
dirs = "5.0"
regex = "1.11"
ropey = "1.6"

# LRU cache for pattern caching optimization
lru = "0.12"

# SmallVec - Stack-allocated vector for optimizing pattern matching bindings
smallvec = "1.11"

# lasso - Fast, thread-safe string interning for symbol tables (optional)
# Provides O(1) symbol comparison instead of O(n) string comparison
lasso = { version = "0.7", features = ["multi-threaded"], optional = true }

# Itertools - Lazy iterator combinators for cartesian products and nondeterminism
itertools = "0.14"

# liblevenshtein - Fuzzy string matching for "Did you mean?" suggestions
# liblevenshtein = { path = "../liblevenshtein-rust", features = ["simd"] }
liblevenshtein = { version = "^0.7", features = ["simd"] }

# TOML - Package manifest parsing (metta.toml)
toml = "0.8"
# Serde - Serialization for package manifest
serde = { version = "1.0", features = ["derive"] }
# hex crate removed — was used for MORK byte serialization (deprecated)
# itoa - Fast integer-to-string formatting on stack (no heap allocation)
itoa = "1"
# ryu - Fast float-to-string formatting on stack (no heap allocation)
ryu = "1"
# Semver - Version constraint parsing and validation
semver = "1.0"

tracing = "0.1"
tracing-subscriber = "0.3"

# Note: jemalloc is no longer included via PathMap; add tikv-jemallocator directly if needed

# Cranelift JIT - Native code generation for hot bytecode paths
# Provides 2-5x additional speedup over bytecode VM for arithmetic chains
# Always included - tiered compilation is always enabled
cranelift = "0.126"
cranelift-frontend = "0.126"
cranelift-jit = "0.126"
cranelift-module = "0.126"
cranelift-native = "0.126"

# target-lexicon - Target triple parsing for cross-platform JIT ISA creation
# Used for explicit CPU feature detection to avoid SIGILL under taskset
# Version must match what cranelift uses (0.13)
target-lexicon = "0.13"

# DashMap - Lock-free concurrent hash map for tiered compilation cache
dashmap = "6.1"

# xxHash - Fast SIMD hash with excellent quality (replaces FxHash)
# xxh3 is the fastest variant with SIMD acceleration (SSE2, AVX2, NEON)
# Provides 3x+ faster hashing for typical MeTTa expression sizes and much
# better collision resistance than FxHash (critical for cache correctness).
# Safe SIMD implementation (no ASan violations like gxhash).
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# gxhash - AES-accelerated hash for long inputs (≥16 bytes)
# Combined with xxh3 for short inputs provides optimal hybrid hashing
gxhash = "3"

# Crossbeam - Lock-free channels for thread pools and GC pool
crossbeam-channel = "0.5"
# Crossbeam deque - Lock-free work-stealing deques (Chase-Lev algorithm)
crossbeam-deque = "0.8"

# phf - Compile-time perfect hash sets for O(1) lookup
phf = { version = "0.11", features = ["macros"] }

# num_cpus - CPU count detection for thread pool sizing
num_cpus = "1.16"

# parking_lot - Faster mutexes and condition variables for priority scheduler
parking_lot = "0.12"


# libc - Low-level C bindings for mmap/munmap page allocation
# Used by the GC slab allocator for guaranteed OS memory release
libc = "0.2"

# Signal handling for diagnostic dump (SIGTERM/SIGUSR1)
signal-hook = "0.3"

# portable-atomic - 128-bit atomics for lock-free Treiber stack (CMPXCHG16B / LL-SC)
portable-atomic = { version = "1", features = ["fallback"] }

# memchr - SIMD-accelerated byte search for fast comment/string scanning in parser
memchr = "2"


# postcard — fast, compact binary serde format for evaluation traces (optional)
postcard = { version = "1", features = ["alloc"], optional = true }
# trace-format - Shared trace event types (optional, enabled by eval-trace feature)
trace-format = { path = "trace-format", optional = true }

[features]
default = ["interning", "async", "symbol-interning"]
async = ["tokio"]
interning = []
# Symbol interning: O(1) symbol comparison via lasso crate
# Provides 5-10% improvement for rule-heavy workloads
symbol-interning = ["lasso"]

# Evaluation trace: binary tracing of every rewrite, type check, error,
# bailout, and tier transition with full source location provenance.
# Zero cost when disabled (no branches, no dead code, no rkyv dep).
# Enable with: cargo build --release --features eval-trace
eval-trace = ["dep:postcard", "dep:trace-format"]

# Diagnostic statistics tracking: atomic counters for --gc-stats, --tier-stats, --pool-stats.
# Zero overhead when disabled (no atomic increments on hot paths).
# Enable with: cargo build --release --features track-stats
track-stats = []

[dev-dependencies]
# For integration tests
regex = "1.10"
nom = "7.1"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "process",
    "time",
    "sync",
    "macros",
] }
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
divan = "0.1.21"
paste = "1.0.15"
clap = { version = "4.5", features = ["derive"] }
# Property-based testing for thorough coverage
proptest = "1.9"
# System info - RSS monitoring for memory leak stress tests
sysinfo = "0.33"

[[bench]]
name = "parser_benchmark"
harness = false

[[bench]]
name = "e2e"
path = "benches/e2e/e2e.rs"
harness = false

[[bench]]
name = "e2e_throughput_configurable"
path = "benches/e2e/e2e_throughput_configurable.rs"
harness = false

[[bench]]
name = "e2e_throughput"
path = "benches/e2e/e2e_throughput.rs"
harness = false

[[bench]]
name = "set_operations"
harness = false

[[bench]]
name = "eval_profiling"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
strip = false        # Keep debug symbols for profiling
debug = true         # Enable line-level profiling

[profile.profiling]
inherits = "release"
strip = false        # Keep debug symbols for flamegraphs
debug = 1            # Line tables only (smaller than debug = true)

[profile.release-with-debug]
inherits = "release"
debug = 2            # Full debug info for GDB (level 2 = maximum)
strip = false        # Keep symbols for debugging
debug-assertions = true

# Debian package metadata
[package.metadata.deb]
maintainer = "F1R3FLY.io <noreply@f1r3fly.io>"
copyright = "2024, F1R3FLY.io <noreply@f1r3fly.io>"
license-file = ["LICENSE", "4"]
extended-description = """\
MeTTaTron is a MeTTa language evaluator with lazy evaluation and pattern matching.
MeTTa is a language with LISP-like S-expression syntax supporting rules, control flow,
type assertions, and grounded functions."""
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    [
        "target/release/mettatron",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/rholang-cli",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/libmettatron.so",
        "usr/lib/",
        "644",
    ],
    [
        "target/release/libmettatron.rlib",
        "usr/lib/",
        "644",
    ],
    [
        "README.md",
        "usr/share/doc/mettatron/",
        "644",
    ],
    [
        "LICENSE",
        "usr/share/doc/mettatron/",
        "644",
    ],
    [
        "examples/*",
        "usr/share/doc/mettatron/examples/",
        "644",
    ],
]

# RPM package metadata
[package.metadata.generate-rpm]
license = "Apache-2.0"
assets = [
    { source = "target/release/mettatron", dest = "/usr/bin/mettatron", mode = "755" },
    { source = "target/release/rholang-cli", dest = "/usr/bin/rholang-cli", mode = "755" },
    { source = "target/release/libmettatron.so", dest = "/usr/lib64/libmettatron.so", mode = "644" },
    { source = "target/release/libmettatron.rlib", dest = "/usr/lib64/libmettatron.rlib", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mettatron/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/mettatron/LICENSE", mode = "644", doc = true },
]

# MORK/PathMap patch sections removed — no longer needed after MettaTrie migration
