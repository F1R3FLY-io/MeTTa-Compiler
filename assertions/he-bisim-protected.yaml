# Hard-floor fixtures (never demote regardless of PHE row).
# These exercise HE behavior that is OBSERVATIONALLY EQUIVALENT to PT after
# canonical normalization (e.g., α-display, multiset-equal results). They
# are spec-V14 `same` across both axes and a regression here indicates
# accidental damage, not deliberate alignment.
hard_floor:
  # Will be populated from spec/J-three-way-alignment.md `same/same` rows.
  # The exhaustive list is generated by
  # `python3 assertions/build_he_protection.py --hard-floor`.
  - bucket: M11-bisimilarity-he
    selector: "post_rebase_classification.he_mtt == 'same' AND post_rebase_classification.pt_mtt == 'same'"
