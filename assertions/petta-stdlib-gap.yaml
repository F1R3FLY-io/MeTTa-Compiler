# petta-stdlib-gap.yaml — Registry of PT-canonical stdlib helpers and their
# implementation status in MTT.
#
# Per the mandate, MTT cannot load PeTTa's lib_he.metta at runtime
# (no MeTTa code in built-ins). Every PT helper must be hand-ported to
# native Rust. This file tracks the port status and is the authoritative
# checklist for stdlib completeness.

version: 1
last_updated: 2026-05-21
mandate: |
  PeTTa's lib_he.metta is 80 LOC of pure MeTTa. The MTT mandate
  (.claude/CLAUDE.md, [[feedback-stack-safety-mandate]]) forbids MeTTa-source
  built-ins. Each PT helper below must be implemented in native Rust under
  src/backend/grounded/ (or as a trampoline-resident special form under
  src/backend/eval/step/sexpr.rs).
petta_libhe_source: /home/dylon/Workspace/f1r3fly.io/PeTTa/lib/lib_he.metta

# Status values:
#   ported    — native Rust impl exists and matches PT semantics
#   partial   — exists but with HE-divergent semantics; needs PT alignment
#   missing   — not in MTT; must be added
#   excluded  — out-of-scope (FFI, security)

helpers:
  # Phase 2.2 design decision (2026-05-21): OverridableOpId NOT extended for
  # new PT-only forms (progn/prog1/forall/foldall/catch-3arg/cut/etc.).
  # Rationale: OverridableOpId is a per-environment bitset that lets user
  # rules `(= (name args...) body)` shadow MTT's grounded fast-path
  # helpers. The new PT-only forms in Phase 2.1/2.3 are SPECIAL FORMS
  # dispatched at the `eval_sexpr_step_generic` arm level — they consume
  # all their args structurally before any rule lookup. User rules with
  # those heads would not be reached at the dispatch arm level today;
  # adding them to OverridableOpId would be premature optimization.
  # If user-rule shadowing of these forms becomes a need, OverridableOpId
  # can be extended (currently has 3 slots free under the AtomicU32 cap;
  # beyond that requires promotion to AtomicU64).

  # Phase 1.4 audit result (2026-05-21): NO CODE CHANGE.
  # `add-atom &self (= (head) body)` already auto-compiles to a queryable
  # rule via env.add_to_space (which routes equations through add_rule).
  # `add-atom &kb (= ...)` stores as data only — matching PT per-space
  # semantics where rules are scoped to their containing predicate space.

  # Phase 1.7 audit results (2026-05-21):
  #
  # The per-divergence agent claimed five rows were "already PT-aligned":
  #   #1  let unify-failure   — REFUTED. `(let (S $x) 5 $x)` emits
  #       (Error BadArgType (BadArgType 0 ...)) instead of branch drop.
  #       Needs Phase 3.2 let/chain unify failure plumbing.
  #   #2  case (Empty default) — REFUTED. `(case (foo-undefined) ((Empty d)
  #       ($x $x)))` returns `[(foo-undefined)]` not `[d]`. The HE behavior
  #       requires the scrutinee to *evaluate to* Empty for the Empty arm
  #       to fire. PT matches when scrutinee has no result. Needs PHE-007
  #       work in Phase 3 / Phase 6.
  #   #11 unify lazy-branch    — CONFIRMED. `(unify foo foo matched not)` → [matched].
  #   #12 add-reduct evaluates — AMBIGUOUS. `(add-reduct &s (= (greet) hello))`
  #       stores the rule definition; the body-evaluation distinction only
  #       matters when the body is a reducible expression with rules. Needs
  #       targeted fixture.
  #   #13 superpose permissive — CONFIRMED. `(superpose (1 2 3))` → [1, 2, 3].

  # Phase 1.5 audit result (2026-05-21): MeTTa Bool atoms are PT-canonical
  # as `True`/`False` (capitalized) in BOTH PT and MTT. Evidence:
  # 18 PT fixtures expect `"True"` (e.g. P07-builtins/014-num-eq, /016-not).
  # Lowercase `"true"`/`"false"` in PT spec ARE NOT MeTTa Booleans — they
  # are Prolog truth values returned by PT's side-effect ops (e.g.
  # `remove-atom` in P03-spaces/001-remove-function). That divergence is
  # tracked under PHE-012 (effect surface) in Phase 6, not Phase 1.5.
  # Conclusion: NO CODE CHANGE for Phase 1.5. MTT is already aligned.

