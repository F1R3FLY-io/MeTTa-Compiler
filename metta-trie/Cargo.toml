[package]
name = "metta-trie"
version = "0.1.0"
edition = "2021"
authors = ["F1R3FLY.io"]
description = "A trie-map that discriminates on MeTTa expression components directly, with algebraic operations and CoW structural sharing"
license = "Apache-2.0"
keywords = ["trie", "metta", "pattern-matching", "lattice"]
categories = ["data-structures"]

[dependencies]
# SmallVec - Stack-allocated vectors for path decomposition and bindings
smallvec = "1.11"

# xxHash - Fast hashing for Merkle compaction and content-addressed deduplication
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
# Property-based testing
proptest = "1.9"
