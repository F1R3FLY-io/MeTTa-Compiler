\* C1.c NEGATIVE, small discriminator: any-young reuse permits a lower-segment
\* old parent to retain an edge to a higher-segment young child, so the
\* historical skipped-old young-only marker can miss a reachable young node.
CONSTANTS
    SEGMENTS = {0, 1}
    OFFSETS  = {0}
    MaxRoots = 2
    ReuseCurSegOnly = FALSE

SPECIFICATION Spec

INVARIANT
    YoungOnlyMarkReachesLiveYoung
