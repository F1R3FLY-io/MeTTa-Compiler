\* POSITIVE (the production SATB E5 fix): the double rendezvous reopens, the
\* started-gate keeps the worker from phantom-re-parking, the reopen notify wakes
\* the teardown else-arm, and the B-closure bounces a terminal break back into the
\* straddle so the parent re-parks+publishes for K+1. The driver's witness clears,
\* the sweep runs, close_cycle#2 resumes the parent, and CompletionGuard::Drop
\* fires. The post-cycle evaluator always makes progress.

CONSTANTS
    SatbDoubleRendezvous = TRUE
    UseStartedGate = TRUE
    BClosure = TRUE
    ResumeNotifyOnReopen = TRUE

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoSweepWhileUnpublished

PROPERTY
    EventuallyParentDone
    StrandedCannotPersist
