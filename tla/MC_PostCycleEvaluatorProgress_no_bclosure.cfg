\* NEGATIVE (the relocated hang, now reachable under the DOUBLE rendezvous): the
\* started-gate closes the conc_mark->rdv2 window, but without the B-closure the
\* rejoin-tail terminal break that fired in the teardown window (stale started=K,
\* !gip just after close_cycle#1) does NOT re-check `started`. The parent rejoins
\* for good at gen K; then rdv2 opens and set_current_cycle_started(K+1) makes the
\* driver wait on the parent's occupied,published=K (< started=K+1) slot forever.
\* The sweep never runs, close_cycle#2 never runs, the parent is never resumed.
\* EventuallyParentDone is VIOLATED. NoSweepWhileUnpublished still holds.

CONSTANTS
    SatbDoubleRendezvous = TRUE
    UseStartedGate = TRUE
    BClosure = FALSE
    ResumeNotifyOnReopen = TRUE

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoSweepWhileUnpublished

PROPERTY
    EventuallyParentDone
    StrandedCannotPersist
