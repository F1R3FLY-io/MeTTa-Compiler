\* NEGATIVE (the SATB-reopen lost wakeup -- the candidate residual the single-cycle
\* loom cannot see): set_current_cycle_started does NOT notify the straddle condvar
\* on the reopen edge. A parent that fell into the teardown else-arm (gip && gen!=my
\* && started<=my) after close_cycle#1 sleeps past the K+1 start: it is never woken
\* back to re-evaluate the started-gate, so it never re-parks+publishes for K+1, the
\* driver's witness wait at rdv2 never clears, the sweep never runs, close_cycle#2
\* never runs, the parent is never resumed. EventuallyParentDone is VIOLATED.
\* NoSweepWhileUnpublished still holds (vacuously -- the sweep is never reached).

CONSTANTS
    SatbDoubleRendezvous = TRUE
    UseStartedGate = TRUE
    BClosure = TRUE
    ResumeNotifyOnReopen = FALSE

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoSweepWhileUnpublished

PROPERTY
    EventuallyParentDone
    StrandedCannotPersist
