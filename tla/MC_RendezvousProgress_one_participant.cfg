\* POSITIVE: a one-participant rendezvous is valid; the sole mutator
\* contributes, the cycle closes, generation advances, and resume completes.

CONSTANTS
    N = 1
    WorkersContribute = TRUE
    CleanupOnPanic = TRUE
    BumpAtClose = TRUE
    UseGenerationResume = TRUE
    ResumeNotify = TRUE
    BackToBackBeforeResume = TRUE

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoDoneWithParkedWorker

PROPERTY
    EventuallyRendezvousResumed
