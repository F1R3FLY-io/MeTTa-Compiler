\* NEGATIVE: collection panic skips rendezvous teardown, leaving parked workers
\* without a cycle close/resume.

CONSTANTS
    N = 3
    WorkersContribute = TRUE
    CleanupOnPanic = FALSE
    BumpAtClose = TRUE
    UseGenerationResume = TRUE
    ResumeNotify = TRUE
    BackToBackBeforeResume = TRUE

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoDoneWithParkedWorker

PROPERTY
    EventuallyRendezvousResumed
