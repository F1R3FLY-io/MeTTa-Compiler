\* TLC Configuration for StoreCentricGC — Safety Invariant Checking
\*
\* Run (under the project's resource-limited cgroup, per CLAUDE.md):
\*   systemd-run --user --scope -p MemoryMax=96G -p CPUQuota=1800% \
\*       -p IOWeight=30 -p TasksMax=200 \
\*       tlc -workers auto MC_StoreCentricGC.tla -config MC_StoreCentricGC.cfg
\*
\* SMALL constants for COMPLETE exhaustive checking (queue drains to 0):
\*   2 segments x 2 offsets = 4 Addrs, 2 worker threads, |psi| <= 3 roots.
\* This is the authoritative config: it is the smallest one whose complete
\* state graph exercises EVERY safety path non-trivially (all confirmed
\* reachable by the coverage probes — see RESULTS.md "Coverage" sub-section):
\*   - multi-level TRANSITIVE marking over rewired edges (root -> non-root
\*     child, child marked via its marked parent),
\*   - FREE-LIST reuse (sweep rebuilds the list, Alloc consumes from it),
\*   - wholesale SEGMENT RELEASE (one 2-Addr segment fully dead, released,
\*     while the other stays partly live),
\*   - the 2-worker QUIESCENCE rendezvous (BOTH must park before marking).
\* MaxRoots=3 (not 2) is required: a transitive mark needs two roots A,B plus
\* headroom so B can be RemoveRoot'd while still reachable via A's edge.
\* The reduced 4-Addr set tames `edges` (4 x 2^4) and `store` (3^4) so the
\* FULL reachable graph completes in ~80s. (Raising OFFSETS to {0,1,2} = 6
\* Addrs makes the `edges` breadth explode — the queue grows past 200M and a
\* complete run is intractable; that larger config was run depth-bounded as a
\* partial-confidence check, see RESULTS.md.)

CONSTANTS
    SEGMENTS = {0, 1}
    OFFSETS  = {0, 1}
    NumWorkers = 2
    MaxRoots = 3

SPECIFICATION Spec

\* The 5 design-claim safety invariants (PRIMARY) + type + auxiliary
\* well-formedness invariants. ALL must HOLD (no counterexample).
INVARIANT
    TypeOK
    NoUseAfterFree
    NoLostObjects
    SegmentReleaseSafety
    QuiescenceInvariant
    NoConcurrentFree
    NoMarksWhileMutating
    RootsAreOccupied
    ActiveSetCorrect
    ReleasedSegmentsAreFree
    FreeSlotsHaveNoEdges
