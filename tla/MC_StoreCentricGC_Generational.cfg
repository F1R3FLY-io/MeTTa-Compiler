\* TLC Configuration for StoreCentricGC_Generational (C1.b) — SMALL model,
\* COMPLETE exhaustive run.
\*
\* Run (CPU/mem-capped, foreground):
\*   systemd-run --user --scope -p MemoryMax=24G -p MemorySwapMax=0 \
\*       -p CPUQuota=800% -p TasksMax=200 \
\*       java -XX:+UseParallelGC -cp ~/.tla/tla2tools.jar tlc2.TLC \
\*       -workers auto MC_StoreCentricGC_Generational.tla \
\*       -config MC_StoreCentricGC_Generational.cfg
\*
\* 2 segments x 2 offsets = 4 Addrs, |psi| <= 3 roots, single mutator at
\* quiescence, youngFloor in 0..2. Exercises: full transitive mark, OLD->YOUNG
\* edges (free-list-reuse hazard), MINOR sweep retaining old garbage, MAJOR
\* sweep + segment release, promotion to every legal boundary.

CONSTANTS
    SEGMENTS = {0, 1}
    OFFSETS  = {0, 1}
    MaxRoots = 3

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoUseAfterFree
    NoLostObjects
    SegmentReleaseSafety
    NoMarksWhileMutating
    RootsAreOccupied
    FreeListWellFormed

PROPERTY
    MinorSweepOnlyReclaimsYoung
    MinorNeverFreesReachable
