\* TLC Configuration for StoreCentricGC_Generational (C1.b), small gate.
\*
\* Two one-slot segments are enough to exercise promotion, minor/major sweep,
\* old/young boundaries, old->young edges via RewireEdge, and whole-segment
\* release while keeping the default formal gate disk-light.

CONSTANTS
    SEGMENTS = {0, 1}
    OFFSETS  = {0}
    MaxRoots = 2

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoUseAfterFree
    NoLostObjects
    SegmentReleaseSafety
    NoMarksWhileMutating
    RootsAreOccupied
    FreeListWellFormed

PROPERTY
    MinorSweepOnlyReclaimsYoung
    MinorNeverFreesReachable
