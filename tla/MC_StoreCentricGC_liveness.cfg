\* TLC Configuration for StoreCentricGC — LIVENESS / TERMINATION sanity.
\*
\* Run:
\*   systemd-run --user --scope -p MemoryMax=96G -p CPUQuota=1800% \
\*       -p IOWeight=30 -p TasksMax=200 \
\*       tlc -workers auto MC_StoreCentricGC.tla -config MC_StoreCentricGC_liveness.cfg
\*
\* Uses FairSpec (weak fairness on WorkerPark + the collector pipeline) and
\* checks that a requested GC eventually completes and the mark/sweep cycle
\* terminates. MINIMAL constants — liveness checking does per-property cycle
\* detection over the state graph and is far more expensive than safety, so we
\* shrink to the smallest config that still has a non-trivial GC cycle.
\*   2 segments x 2 offsets = 4 Addrs, 1 worker, |psi| <= 2 roots.

CONSTANTS
    SEGMENTS = {0, 1}
    OFFSETS  = {0, 1}
    NumWorkers = 1
    MaxRoots = 2

SPECIFICATION FairSpec

\* Safety still checked alongside liveness.
INVARIANT
    TypeOK
    NoUseAfterFree
    NoLostObjects
    SegmentReleaseSafety
    QuiescenceInvariant
    NoConcurrentFree

\* Liveness / termination sanity.
PROPERTY
    GCEventuallyCompletes
    CycleTerminates
