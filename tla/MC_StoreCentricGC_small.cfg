\* TLC Configuration for StoreCentricGC — SMALL model, COMPLETE exhaustive run.
\*
\* Run:
\*   systemd-run --user --scope -p MemoryMax=96G -p CPUQuota=1800% \
\*       -p IOWeight=30 -p TasksMax=200 \
\*       tlc -workers auto MC_StoreCentricGC.tla -config MC_StoreCentricGC_small.cfg
\*
\* 2 segments x 2 offsets = 4 Addrs, 2 workers, |psi| <= 2 roots.
\* This is the FAST minimal-safety smoke config (completes in ~1 min, full
\* reachable graph, queue drains to 0). It exercises segment release, the
\* 2-worker quiescence rendezvous, and free-list rebuild + reuse.
\*
\* NOTE: at MaxRoots=2 this config does NOT reach a multi-level TRANSITIVE
\* mark (a marked non-root child via a marked parent) — that needs two roots
\* A,B plus headroom so B can be RemoveRoot'd while still reachable via A's
\* edge, i.e. MaxRoots>=3. For the authoritative FULL-coverage complete run
\* (which DOES reach transitive marking), use MC_StoreCentricGC.cfg
\* (MaxRoots=3). Keep this config as a quick regression smoke test.

CONSTANTS
    SEGMENTS = {0, 1}
    OFFSETS  = {0, 1}
    NumWorkers = 2
    MaxRoots = 2

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoUseAfterFree
    NoLostObjects
    SegmentReleaseSafety
    QuiescenceInvariant
    NoConcurrentFree
    NoMarksWhileMutating
    RootsAreOccupied
    ActiveSetCorrect
    ReleasedSegmentsAreFree
    FreeSlotsHaveNoEdges
