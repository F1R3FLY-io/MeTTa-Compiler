\* TLC Configuration for SlabGC Model Checking
\* Run: cd tla && tlc MC_SlabGC -workers auto -config SlabGC.cfg

CONSTANT
    MaxSlots = 6
    MaxRoots = 3
    MaxExprs = 3

SPECIFICATION Spec

\* Safety Invariants (all expected to HOLD)
INVARIANT
    TypeOK
    NoLiveValueFreed
    RootsAreAllocated
    FreeSetValid
    BumpPtrValid
    MemoryBounded

\* These invariants should be checked separately:
\* INVARIANT NoDoubleFree
\* INVARIANT SweepCorrectness
\* INVARIANT NoDataRace
