\* TLC Configuration for SlabGC_Quiescent Safety Invariant Checking
\* Run: cd tla && /usr/bin/tlc MC_SlabGC_Quiescent -workers auto -config SlabGC_Quiescent.cfg
\*
\* Standard config: MaxSlots=4 exercises free-list reuse and page release
\* with more allocation patterns than the small config. MaxExprs=1 and
\* MaxContextIds=2 keep session-related state space tractable while still
\* verifying the full session GC lifecycle (one session per thread).
\*
\* For multi-expression session GC verification, use MaxExprs=2 with
\* MaxSlots=3 (SlabGC_Quiescent_small.cfg covers this pattern at
\* reduced slot count).

CONSTANT
    NumEvalThreads = 2
    MaxSlots = 4
    MaxRoots = 2
    MaxExprs = 1
    AllocDeltaThreshold = 2
    MinGcThreshold = 2
    SlotsPerPage = 2
    MaxContextIds = 2

SPECIFICATION Spec

\* Safety Invariants — ALL must HOLD
INVARIANT
    TypeOK
    NoLiveValueFreed
    SnapshotCapturesAllRoots
    GcFlagConsistent
    ActiveCountCorrect
    RegisteredRootsAreAllocated
    StackRootsAreAllocated
    FreeSetValid
    BumpPtrValid
    MemoryBounded
    AtMostOneGcAcquire
    StackRootsOnlyDuringEval
    GcThresholdPositive
    BackpressureLevelBounded
    GcSweepIsComplete
    NoLiveValueInDeadSet
    NoStaleFreeSetEntries
    NoLiveOnReleasedPage
    CurrentPageNotReleased
    ReleasedPagesAreEmpty
    ContextIdConsistency
    SessionGcExcludesQuiescentGc
    SafepointRootsOnlyDuringSafepoint
    SafepointRootsAreAllocated
    QuiescentRootsComplete
