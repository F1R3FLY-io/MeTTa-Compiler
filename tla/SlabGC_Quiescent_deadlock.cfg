\* TLC Configuration for SlabGC_Quiescent Liveness and Deadlock Checking
\* Run: cd tla && /usr/bin/tlc MC_SlabGC_Quiescent -workers auto -config SlabGC_Quiescent_deadlock.cfg
\*
\* Uses FairSpec (with weak + strong fairness) and PROPERTY for temporal properties.
\* TLC checks both deadlock freedom and the listed liveness properties.
\*
\* FAIRNESS NOTES:
\*   - CronMonitorPoll has WF (monitor always eventually polls)
\*   - ContinueEval, ThreadDone have SF (may be briefly disabled by gc_acquire)
\*   - SnapshotOK, Abort have SF (may be briefly disabled by EvalGuardEnter)

CONSTANT
    NumEvalThreads = 2
    MaxSlots = 4
    MaxRoots = 2
    MaxExprs = 2
    AllocDeltaThreshold = 2
    MinGcThreshold = 2
    SlotsPerPage = 2

SPECIFICATION FairSpec

\* Safety invariant (also checked during liveness exploration)
INVARIANT
    TypeOK

\* Liveness properties — must eventually hold under fairness
PROPERTY
    AllThreadsComplete
    GcEventuallyTriggered
    BackpressureEventuallyRelaxes
    AllDeadValuesEventuallyFreed
    EmptyPagesEventuallyReleased
