\* TLC Configuration for SlabGC_Quiescent — Small Model (Fast Feedback)
\* Run: cd tla && /usr/bin/tlc MC_SlabGC_Quiescent -workers auto -config SlabGC_Quiescent_small.cfg
\*
\* Reduced constants for tractable session-based GC model checking.
\* Use this config for fast iteration during development (seconds to minutes).
\* Scale up to SlabGC_Quiescent.cfg once this passes.

CONSTANT
    NumEvalThreads = 2
    MaxSlots = 3
    MaxRoots = 2
    MaxExprs = 1
    AllocDeltaThreshold = 1
    MinGcThreshold = 1
    SlotsPerPage = 2
    MaxContextIds = 2

SPECIFICATION Spec

\* Safety Invariants — ALL must HOLD
INVARIANT
    TypeOK
    NoLiveValueFreed
    SnapshotCapturesAllRoots
    GcFlagConsistent
    ActiveCountCorrect
    RegisteredRootsAreAllocated
    StackRootsAreAllocated
    FreeSetValid
    BumpPtrValid
    MemoryBounded
    AtMostOneGcAcquire
    StackRootsOnlyDuringEval
    GcThresholdPositive
    BackpressureLevelBounded
    GcSweepIsComplete
    NoLiveValueInDeadSet
    NoStaleFreeSetEntries
    NoLiveOnReleasedPage
    CurrentPageNotReleased
    ReleasedPagesAreEmpty
    ContextIdConsistency
    SessionGcExcludesQuiescentGc
