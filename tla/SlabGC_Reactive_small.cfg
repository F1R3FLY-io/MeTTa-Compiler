\* TLC Configuration for SlabGC_Reactive — Small Model (Completable)
\* Uses smaller constants to ensure TLC can explore the entire state space.
\* Run: cd tla && tlc MC_SlabGC_Reactive -workers auto -config SlabGC_Reactive_small.cfg

CONSTANT
    MaxSlots = 4
    MaxRoots = 2
    MaxExprs = 2

SPECIFICATION Spec

\* Safety Invariants (ALL must HOLD — these were violated in original spec)
INVARIANT
    TypeOK
    NoLiveValueFreed
    RootsAreAllocated
    FreeSetValid
    BumpPtrValid
    MemoryBounded
    NoDoubleFree
