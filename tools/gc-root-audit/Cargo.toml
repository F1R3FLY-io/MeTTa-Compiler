[package]
name = "gc-root-audit"
version = "0.1.0"
edition = "2021"
description = "Static analysis tool to find unregistered GC roots in MeTTaTron"

[dependencies]
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
