[package]
name = "trace-analyzer"
version = "0.1.0"
edition = "2021"
description = "Analysis tool for MeTTaTron evaluation trace files"

[dependencies]
trace-format = { path = "../../trace-format" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
memmap2 = "0.9"
